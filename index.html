<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Nathalia & Raphael</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    /* =========================
       CONFIGURAÇÕES GERAIS
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: #f7f5f1;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255,255,255,0.95) 0%,
          rgba(247,245,241,0.92) 45%,
          rgba(239,235,227,0.95) 100%
        );

      color: #5d4634;

      font-family: 'Montserrat', sans-serif;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }


    /* =========================
       CADA TELA
    ========================= */

    .screen {
      position: relative;

      width: 100%;
      min-height: 100svh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }


    /* =========================
       MOLDURA
    ========================= */

    .frame {
      position: absolute;

      top: 14px;
      bottom: 14px;
      left: 14px;
      right: 14px;

      border: 1px solid rgba(151, 121, 77, 0.55);

      pointer-events: none;
    }

    .frame::before {
      content: "";

      position: absolute;

      top: 7px;
      bottom: 7px;
      left: 7px;
      right: 7px;

      border: 1px solid rgba(151, 121, 77, 0.18);
    }


    /* =========================
       DETALHES DECORATIVOS
    ========================= */

    .ornament {
      position: absolute;

      width: 55px;
      height: 55px;

      opacity: 0.55;

      pointer-events: none;
    }

    .ornament::before,
    .ornament::after {
      content: "";

      position: absolute;

      background: #a88a5a;
    }

    .ornament::before {
      width: 1px;
      height: 45px;
      left: 27px;
      top: 5px;

      transform: rotate(42deg);
    }

    .ornament::after {
      width: 1px;
      height: 30px;
      left: 38px;
      top: 16px;

      transform: rotate(-42deg);
    }

    .ornament.top-left {
      top: 28px;
      left: 26px;
    }

    .ornament.top-right {
      top: 28px;
      right: 26px;
      transform: scaleX(-1);
    }

    .ornament.bottom-left {
      bottom: 28px;
      left: 26px;
      transform: scaleY(-1);
    }

    .ornament.bottom-right {
      bottom: 28px;
      right: 26px;
      transform: scale(-1);
    }


    /* =========================
       TELA 1
    ========================= */

    #screen1 {
      flex-direction: column;

      padding:
        max(55px, env(safe-area-inset-top))
        30px
        max(45px, env(safe-area-inset-bottom))
        30px;

      text-align: center;
    }

    .intro {
      margin-bottom: 22px;

      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 400;

      letter-spacing: 4px;
      text-transform: uppercase;

      color: #8f7653;

      animation: fadeUp 1.2s ease both;
    }

    .monogram {
      width: min(48vw, 210px);
      max-width: 210px;

      height: auto;

      margin-bottom: 15px;

      object-fit: contain;

      filter: drop-shadow(0 8px 10px rgba(92, 68, 38, 0.08));

      animation: fadeIn 1.4s ease both;
    }

    .names {
      display: flex;
      flex-direction: column;
      align-items: center;

      line-height: 0.88;

      margin-bottom: 22px;

      animation: fadeUp 1.5s ease both;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;

      font-size: clamp(42px, 12vw, 70px);

      font-weight: 400;

      letter-spacing: 1px;

      color: #60442f;
    }

    .ampersand {
      font-family: 'Cormorant Garamond', serif;

      font-size: 27px;

      margin: 7px 0;

      color: #a48757;
    }

    .date {
      font-family: 'Cormorant Garamond', serif;

      font-size: 18px;

      font-weight: 500;

      letter-spacing: 6px;

      color: #9a7b4b;

      margin-bottom: 28px;

      animation: fadeUp 1.7s ease both;
    }


    /* =========================
       BOTÕES
    ========================= */

    .gold-button {
      appearance: none;
      border: none;

      min-width: 190px;
      min-height: 50px;

      padding: 13px 25px;

      background: transparent;

      border: 1px solid rgba(146, 113, 65, 0.75);

      color: #755b3d;

      font-family: 'Montserrat', sans-serif;

      font-size: 10px;
      font-weight: 500;

      letter-spacing: 3px;

      cursor: pointer;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;

      animation: fadeUp 1.9s ease both;
    }

    .gold-button:active {
      transform: scale(0.97);
      background: rgba(151, 120, 73, 0.12);
    }


    /* =========================
       TELA 2
    ========================= */

    #screen2 {
      display: none;

      flex-direction: column;

      padding:
        max(48px, env(safe-area-inset-top))
        30px
        max(45px, env(safe-area-inset-bottom))
        30px;

      text-align: center;
    }

    #screen2.active {
      display: flex;

      animation: screenIn 0.9s ease both;
    }

    .screen2-content {
      width: 100%;
      max-width: 500px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .small-title {
      font-family: 'Montserrat', sans-serif;

      font-size: 10px;
      font-weight: 500;

      letter-spacing: 4px;

      color: #9a7b4b;

      margin-bottom: 16px;
    }

    .celebrate {
      font-family: 'Cormorant Garamond', serif;

      font-size: clamp(38px, 11vw, 58px);

      font-weight: 400;

      letter-spacing: 1px;

      color: #674a34;

      margin-bottom: 22px;
    }


    /* =========================
       FOTO DO CASAL
    ========================= */

    .couple-photo {
      width: min(82vw, 370px);

      aspect-ratio: 0.82;

      object-fit: cover;

      object-position: center 30%;

      border-radius: 180px 180px 25px 25px;

      border: 1px solid rgba(157, 126, 78, 0.65);

      padding: 6px;

      background: rgba(255,255,255,0.55);

      box-shadow:
        0 15px 35px rgba(69, 48, 28, 0.13);

      margin-bottom: 24px;
    }


    /* =========================
       NOMES TELA 2
    ========================= */

    .names-second {
      font-family: 'Cormorant Garamond', serif;

      font-size: clamp(31px, 9vw, 48px);

      font-weight: 400;

      color: #60442f;

      margin-bottom: 13px;
    }


    /* =========================
       DATA / HORÁRIO
    ========================= */

    .event-date {
      font-family: 'Cormorant Garamond', serif;

      font-size: 22px;

      letter-spacing: 4px;

      color: #9a7b4b;

      margin-bottom: 4px;
    }

    .event-time {
      font-family: 'Montserrat', sans-serif;

      font-size: 13px;

      font-weight: 500;

      letter-spacing: 3px;

      color: #6a4b32;

      margin-bottom: 21px;
    }


    /* =========================
       LOCAL
    ========================= */

    .venue {
      font-family: 'Montserrat', sans-serif;

      font-size: 11px;

      font-weight: 500;

      letter-spacing: 3px;

      color: #725538;

      margin-bottom: 9px;
    }

    .address {
      font-family: 'Montserrat', sans-serif;

      font-size: 10px;

      font-weight: 300;

      line-height: 1.7;

      color: #806b54;

      margin-bottom: 16px;
    }

    .map-link {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 42px;

      padding: 10px 18px;

      border: 1px solid rgba(146, 113, 65, 0.55);

      text-decoration: none;

      color: #80633e;

      font-size: 9px;

      letter-spacing: 2px;

      font-weight: 500;

      margin-bottom: 23px;

      transition: transform 0.2s ease;
    }

    .map-link:active {
      transform: scale(0.97);
    }


    /* =========================
       FRASE
    ========================= */

    .message {
      max-width: 310px;

      font-family: 'Cormorant Garamond', serif;

      font-size: 19px;

      line-height: 1.35;

      font-style: italic;

      color: #765d45;

      margin-bottom: 24px;
    }


    /* =========================
       BOTÃO CONTINUAR
    ========================= */

    .continue-button {
      min-width: 190px;

      min-height: 48px;

      border: 1px solid rgba(146, 113, 65, 0.7);

      background: transparent;

      color: #765a39;

      font-family: 'Montserrat', sans-serif;

      font-size: 9px;

      letter-spacing: 3px;

      font-weight: 500;

      cursor: pointer;
    }


    /* =========================
       BOTÃO VOLTAR
    ========================= */

    .back-button {
      position: absolute;

      top: max(25px, env(safe-area-inset-top));

      left: 28px;

      border: none;

      background: transparent;

      color: #9a7b4b;

      font-family: 'Montserrat', sans-serif;

      font-size: 8px;

      letter-spacing: 2px;

      cursor: pointer;

      opacity: 0.8;
    }


    /* =========================
       ANIMAÇÕES
    ========================= */

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: scale(0.94);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }

    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    @keyframes screenIn {

      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* =========================
       TELAS MAIORES
    ========================= */

    @media (min-width: 700px) {

      .frame {
        top: 25px;
        bottom: 25px;
        left: 35px;
        right: 35px;
      }

      #screen1,
      #screen2 {
        padding-left: 70px;
        padding-right: 70px;
      }

      .monogram {
        width: 210px;
      }

      .name {
        font-size: 70px;
      }

      .celebrate {
        font-size: 58px;
      }

    }

  </style>
</head>


<body>


  <!-- =====================================================
       TELA 1
  ====================================================== -->

  <main id="screen1" class="screen">

    <div class="frame"></div>

    <div class="ornament top-left"></div>
    <div class="ornament top-right"></div>
    <div class="ornament bottom-left"></div>
    <div class="ornament bottom-right"></div>


    <div class="intro">
      Uma nova história começa
    </div>


    <!-- SEU MONOGRAMA -->
    <img
      class="monogram"
      src="monograma-NR-dourado.png"
      alt="Monograma Nathalia e Raphael"
    >


    <div class="names">

      <div class="name">
        NATHALIA
      </div>

      <div class="ampersand">
        &
      </div>

      <div class="name">
        RAPHAEL
      </div>

    </div>


    <div class="date">
      14 · 11 · 2026
    </div>


    <button
      class="gold-button"
      onclick="openInvitation()"
    >
      ABRIR CONVITE
    </button>

  </main>



  <!-- =====================================================
       TELA 2
  ====================================================== -->

  <section id="screen2" class="screen">

    <div class="frame"></div>

    <div class="ornament top-left"></div>
    <div class="ornament top-right"></div>
    <div class="ornament bottom-left"></div>
    <div class="ornament bottom-right"></div>


    <button
      class="back-button"
      onclick="backToFirstScreen()"
    >
      ← VOLTAR
    </button>


    <div class="screen2-content">


      <div class="small-title">
        COM MUITA ALEGRIA
      </div>


      <div class="celebrate">
        Vamos celebrar!
      </div>


      <!--
        COLOQUE A FOTO DO CASAL NO GITHUB
        COM O NOME:

        foto-casal.png
      -->

      <img
        class="couple-photo"
        src="foto-casal.png"
        alt="Nathalia e Raphael"
      >


      <div class="names-second">
        Nathalia & Raphael
      </div>


      <div class="event-date">
        14 · 11 · 2026
      </div>


      <div class="event-time">
        16H30
      </div>


      <div class="venue">
        ESPAÇO PARAÍSO
      </div>


      <div class="address">
        R. Wilson Stefani, 510<br>
        Jardim Vitória · Várzea Paulista – SP<br>
        13236-115
      </div>


      <a
        class="map-link"
        href="https://www.google.com/maps/search/?api=1&query=Espa%C3%A7o%20Para%C3%ADso%2C%20R.%20Wilson%20Stefani%2C%20510%2C%20Jardim%20Vit%C3%B3ria%2C%20V%C3%A1rzea%20Paulista%20-%20SP%2C%2013236-115"
        target="_blank"
        rel="noopener noreferrer"
      >
        VER LOCAL NO MAPA
      </a>


      <div class="message">
        Um dia especial merece ser celebrado
        ao lado de quem amamos.
      </div>


      <button
        class="continue-button"
        onclick="continueInvitation()"
      >
        CONTINUAR ✦
      </button>


    </div>

  </section>



  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    function openInvitation() {

      const screen1 = document.getElementById("screen1");
      const screen2 = document.getElementById("screen2");

      screen1.style.display = "none";

      screen2.classList.add("active");

      window.scrollTo({
        top: 0,
        behavior: "instant"
      });

    }


    function backToFirstScreen() {

      const screen1 = document.getElementById("screen1");
      const screen2 = document.getElementById("screen2");

      screen2.classList.remove("active");

      screen2.style.display = "none";

      screen1.style.display = "flex";

      window.scrollTo({
        top: 0,
        behavior: "instant"
      });

    }


    function continueInvitation() {

      /*
        AQUI VAMOS COLOCAR A TELA 3
        QUANDO ELA ESTIVER PRONTA.
      */

      alert("A próxima parte do convite vem agora. ❤️");

    }

  </script>


</body>
</html>
