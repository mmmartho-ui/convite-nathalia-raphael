<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nathalia & Raphael</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow: hidden;

      font-family: 'Montserrat', sans-serif;

      color: #654943;

      background:
        radial-gradient(
          ellipse at 50% 45%,
          rgba(255,255,255,0.96) 0%,
          rgba(250,244,241,0.96) 42%,
          rgba(239,224,219,0.98) 100%
        );
    }


    /* =====================================
       TELA 1
    ===================================== */

    .opening {

      width: 100%;
      height: 100svh;
      min-height: 650px;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      isolation: isolate;
    }


    /* =====================================
       EFEITO DE ACETATO
    ===================================== */

    .opening::before {

      content: "";

      position: absolute;

      width: 120%;
      height: 70%;

      left: -10%;
      top: 15%;

      background:
        radial-gradient(
          ellipse,
          rgba(255,255,255,0.75) 0%,
          rgba(255,255,255,0) 65%
        );

      filter: blur(18px);

      opacity: .75;

      animation: lightMove 8s ease-in-out infinite alternate;

      z-index: -2;
    }


    @keyframes lightMove {

      from {
        transform: translateX(-5%);
      }

      to {
        transform: translateX(5%);
      }

    }


    /* =====================================
       MOLDURA
    ===================================== */

    .frame {

      position: absolute;

      inset: 13px;

      border: 1px solid rgba(157,112,61,.38);

      pointer-events: none;

      z-index: 5;
    }


    .frame::before {

      content: "";

      position: absolute;

      inset: 7px;

      border: 1px solid rgba(157,112,61,.08);
    }


    /* =====================================
       ORNAMENTOS
    ===================================== */

    .ornament {

      position: absolute;

      width: 145px;
      height: 145px;

      opacity: .34;

      pointer-events: none;

      z-index: -1;
    }


    .ornament::before,
    .ornament::after {

      content: "";

      position: absolute;

      border: 1px solid #a8793e;

      border-radius: 100% 0 100% 0;

      transform: rotate(35deg);

    }


    .ornament::before {

      width: 105px;
      height: 45px;

      top: 25px;
      left: 5px;
    }


    .ornament::after {

      width: 75px;
      height: 35px;

      top: 65px;
      left: 35px;

      transform: rotate(-15deg);
    }


    .ornament.top-left {

      top: -25px;
      left: -20px;

      transform: rotate(-15deg);
    }


    .ornament.bottom-right {

      bottom: -30px;
      right: -20px;

      transform: rotate(165deg);
    }


    /* =====================================
       CONTEÚDO
    ===================================== */

    .content {

      width: min(88%, 420px);

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 35px 0;

      animation: contentAppear 1.8s cubic-bezier(.22,.61,.36,1) both;

    }


    @keyframes contentAppear {

      from {

        opacity: 0;

        transform:
          translateY(22px)
          scale(.98);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* =====================================
       FRASE
    ===================================== */

    .intro {

      color: #96766e;

      font-size: 9px;

      font-weight: 400;

      letter-spacing: 3.2px;

      line-height: 1.9;

      text-transform: uppercase;

      margin-bottom: 27px;

      animation: fadeUp 1.5s .15s both;

    }


    /* =====================================
       MONOGRAMA
    ===================================== */

    .monogram {

      width: 205px;

      max-width: 57vw;

      height: auto;

      display: block;

      margin-bottom: 27px;

      object-fit: contain;

      filter:
        drop-shadow(0 4px 8px rgba(125,85,35,.12));

      animation: monogramAppear 1.7s .25s cubic-bezier(.22,.61,.36,1) both;

    }


    @keyframes monogramAppear {

      from {

        opacity: 0;

        transform:
          scale(.82);

      }

      to {

        opacity: 1;

        transform:
          scale(1);

      }

    }


    /* =====================================
       NOMES
    ===================================== */

    .names {

      font-family: 'Cormorant Garamond', serif;

      color: #62453e;

      font-size: clamp(43px, 11vw, 57px);

      font-weight: 500;

      line-height: .88;

      letter-spacing: .5px;

      animation: fadeUp 1.5s .45s both;

    }


    .names .and {

      color: #a8793e;

      font-family: 'Cormorant Garamond', serif;

      font-size: 25px;

      font-style: italic;

      line-height: 1;

      margin: 12px 0;

    }


    /* =====================================
       DATA
    ===================================== */

    .date {

      margin-top: 29px;

      color: #a8793e;

      font-size: 10px;

      font-weight: 400;

      letter-spacing: 5px;

      animation: fadeUp 1.5s .6s both;

    }


    /* =====================================
       BOTÃO
    ===================================== */

    .enter {

      position: relative;

      margin-top: 42px;

      min-width: 190px;

      padding: 15px 30px;

      border: 1px solid rgba(160,116,62,.72);

      border-radius: 40px;

      background:
        rgba(255,255,255,.30);

      color: #a8793e;

      font-family: 'Montserrat', sans-serif;

      font-size: 9px;

      font-weight: 400;

      letter-spacing: 3px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform .35s ease,
        background .35s ease,
        box-shadow .35s ease;

      animation: fadeUp 1.5s .75s both;

    }


    .enter::after {

      content: "";

      position: absolute;

      inset: -5px;

      border: 1px solid rgba(160,116,62,.10);

      border-radius: 40px;

      transition: .35s ease;

    }


    .enter:hover,
    .enter:active {

      transform: translateY(-2px);

      background: rgba(168,121,62,.10);

      box-shadow:
        0 8px 25px rgba(130,85,40,.10);

    }


    .enter:hover::after {

      inset: -8px;

      opacity: .7;

    }


    /* =====================================
       ANIMAÇÃO GERAL
    ===================================== */

    @keyframes fadeUp {

      from {

        opacity: 0;

        transform:
          translateY(15px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =====================================
       CELULARES PEQUENOS
    ===================================== */

    @media (max-height: 720px) {

      .content {

        transform: scale(.88);

      }

    }


    @media (max-width: 380px) {

      .monogram {

        width: 180px;

      }

      .names {

        font-size: 40px;

      }

      .intro {

        font-size: 8px;

        letter-spacing: 2.5px;

      }

      .date {

        letter-spacing: 4px;

      }

    }


    /* =====================================
       DESKTOP
       apenas como adaptação
    ===================================== */

    @media (min-width: 700px) {

      .content {

        transform: scale(1.05);

      }

      .monogram {

        width: 220px;

      }

    }

  </style>
</head>


<body>

  <main class="opening">

    <div class="frame"></div>

    <div class="ornament top-left"></div>

    <div class="ornament bottom-right"></div>


    <div class="content">

      <div class="intro">
        Uma nova história começa
      </div>


      <img
        class="monogram"
        src="monograma-NR-dourado.png"
        alt="Monograma Nathalia e Raphael"
      >


      <div class="names">

        NATHALIA

        <div class="and">
          &amp;
        </div>

        RAPHAEL

      </div>


      <div class="date">
        14 · 11 · 2026
      </div>


      <button
        class="enter"
        type="button"
        id="enterButton"
      >
        ABRIR CONVITE
      </button>

    </div>

  </main>


  <script>

    document
      .getElementById("enterButton")
      .addEventListener("click", function () {

        alert("Em breve, o convite será aberto. ❤️");

      });

  </script>

</body>
</html>
